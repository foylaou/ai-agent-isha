name: Deploy Keynote to GitHub Pages

on:
  push:
    branches: [keynote]
    paths:
      - "keynote/**"
      - ".github/workflows/deploy-keynote.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: keynote/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: keynote
        run: pnpm install --frozen-lockfile

      - name: Build slides
        working-directory: keynote
        run: pnpm exec slidev build slides.md --base /${{ github.event.repository.name }}/ --out dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: keynote/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
