name: Deploy Keynote to GitHub Pages

on:
  push:
    branches: [keynote]
    paths:
      - "keynote/**"
      - ".github/workflows/deploy-keynote.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: keynote/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: keynote
        run: pnpm install --frozen-lockfile

      - name: Build slides
        working-directory: keynote
        run: pnpm run build:pages

      - name: Deploy to gh-pages branch
        working-directory: keynote
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          pnpm exec gh-pages -d dist -b gh-pages -u "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
